# ============================================================
# OreBonus 模组构建属性
# ============================================================
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 本机未安装 JDK 21 时自动下载（foojay 工具链解析，需要联网）。
# 若已手动安装 JDK 21 并配置了 JAVA_HOME / java.installations.paths，可改为 false。
org.gradle.java.installations.auto-download=true

# --- 游戏 / 加载器版本（与你的整合包保持一致）---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# 你的整合包使用的 NeoForge 版本（F:\HMCL\.minecraft\versions\1.21.1-NeoForge 中记录的 21.1.250）
neo_version=21.1.250
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# --- 模组信息 ---
mod_id=orebonus
mod_name=Ore Bonus Config
mod_license=MIT
mod_version=1.1.0
mod_group_id=com.orebonus
mod_authors=lodest-game
# 注意：gradle.properties 由 Java Properties 按 ISO-8859-1 读取，请勿在此写入中文；
# 中文说明已直接内联在 META-INF/neoforge.mods.toml 中。
